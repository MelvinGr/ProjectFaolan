name: build-docker

# Build the server image on every push to the main branches (and version tags) and publish it to Gitea's
# built-in container registry at git.groenendaal.io/melvingr/projectfaolan.
#   - branch push  -> tag = branch name (development, main) + short commit SHA
#   - tag vX.Y.Z   -> tag = X.Y.Z (+ latest)
# Requires a registered act_runner on the Gitea host WITH Docker available (buildx). The GITHUB_TOKEN that
# Gitea injects is used to authenticate to the registry (it has package write for the repo owner).
on:
  push:
    branches: [development, main]
    tags: ['v*']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: git.groenendaal.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: git.groenendaal.io/melvingr/projectfaolan
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
