# Project Faolan — docker compose.
#
# Default: ONE all-in-one server (login tier + the first realm's world) — the simplest deploy. `docker compose up`
# builds the image (Faolan/Dockerfile) and runs it, persisting the game data via a bind mount. All three images
# live beside their project and build from the repo ROOT as context, because every build graph spans siblings.
#
# CONFIG COMES FROM ENV VARS. The image carries NO faolan.json (it's optional; precedence is env > cmdline > json),
# so every game process sets its config in `environment:` - shared here via the `x-faolan-config` anchor. Two caveats:
#   - ServerIpAddress must be an address the CLIENT can reach (the host IP / a resolvable hostname), NOT 127.0.0.1 -
#     the login tier advertises it (and each Realm row's IpAddress) and the client connects there from OUTSIDE Docker.
#   - The all-in-one SQLite default builds its database into the bind-mounted ./data on first start; a shared
#     multi-realm deployment wants Postgres (no single-writer file lock) - see the commented POSTGRES section.

name: projectfaolan

x-faolan-config: &faolan-config
  Database__Provider: Sqlite                            # nested key -> env uses the __ separator (Database:Provider)
  Database__ConnectionString: "Data Source=/app/data/faolan.db"
  ServerIpAddress: "127.0.0.1"   # host IP / hostname for a real deploy (see note above)
  UniverseAgentPort: 7010
  PlayerAgentPort: 7011
  Mcp__Port: 7099                # nested key -> env uses the __ separator (Mcp:Port). NOT published: the MCP
                                 # endpoint binds 127.0.0.1, which in a container is its own loopback - reaching it
                                 # from the host means `docker exec`, not a port mapping.
  Log__File: "/app/data/faolan.log"  # onto the mounted volume; the default is beside the exe, i.e. lost on recreate
  WelcomeString: "Welcome to Project Faolan!"

services:
  faolan:
    build:
      context: .
      dockerfile: Faolan/Dockerfile
    image: projectfaolan
    # All-in-one: login tier + the first realm's world (the Dockerfile ENTRYPOINT, no --role override).
    environment: *faolan-config
    ports:
      - "7010:7010" # UniverseAgent — the fixed client entry port
      - "7011:7011" # PlayerAgent
      - "7014:7014" # GameServer (realm world)
      - "7012:7012" # AgentServer (chat)
      - "7001:7001" # CsPlayerAgent (guilds/teams)
    # Persist the database across restarts. It is BUILT on first start from the migrations + the faolan.sql baked
    # into the image, then mutated in place by character saves - so this binds a DIRECTORY the container can create
    # the file in, and a clean deploy is just `rm -rf ./data`. Nothing from the repo is mutated.
    volumes:
      - ./data:/app/data
    restart: unless-stopped

