# ---------------------------------------------------------------------------------------------------------------
# POSTGRES backend (commented). Run the game DB on Postgres instead of the per-container SQLite file - the store
# for a shared multi-realm deployment (no single-writer file lock). To use it:
#   1. Uncomment the `postgres` service + the top-level `volumes:` block below.
#   2. On each game process, MERGE the anchor and override the DB keys (env > everything), DROP its `./data`
#      bind mount, and add `depends_on: [postgres]`:
#          environment:
#            <<: *faolan-config
#            Database__Provider: Postgres
#            Database__ConnectionString: "Host=postgres;Port=5432;Database=faolan;Username=faolan;Password=faolan"
#          depends_on: [postgres]
#   3. Seed the fresh PG DB before/at first run: point Faolan.Importer at the same connection (Database__Provider +
#      Database__ConnectionString env vars) - EF Migrates the schema, then the modules load the data.
# ---------------------------------------------------------------------------------------------------------------
#  postgres:
#    image: postgres:17
#    environment:
#      POSTGRES_USER: faolan
#      POSTGRES_PASSWORD: faolan
#      POSTGRES_DB: faolan
#    volumes:
#      - faolan-pgdata:/var/lib/postgresql/data
#    restart: unless-stopped

# ---------------------------------------------------------------------------------------------------------------
# WEB armory / 3D viewer / GM tools (commented; #275). Its own image (Faolan.Web/Dockerfile). Reads the roster from
# the same DB, plus the client RDB dir (RdbDir - a DATA mount) for meshes/renders and CdnUrl (the `cdn` service below).
#
# ⚠️ The database mount is READ-WRITE, not `:ro`. Web is not a reader: the ASP.NET Identity store writes on every
#    login and the GM/admin pages edit rows. Even a pure reader would need it - the file is journal_mode=WAL, and
#    SQLite creates the -wal/-shm sidecars in that DIRECTORY before it can read a WAL database at all.
# ---------------------------------------------------------------------------------------------------------------
#  web:
#    build:
#      context: .
#      dockerfile: Faolan.Web/Dockerfile
#    image: projectfaolan-web
#    environment:
#      Database__Provider: Sqlite
#      Database__ConnectionString: "Data Source=/app/data/faolan.db"
#      RdbDir: "/rdb"                                             # the client RDB, mounted below
#      CdnUrl: "http://cdn:7081/gameupdate/upm/rdb"               # the `cdn` service by its compose DNS name
#    ports:
#      - "7080:8080"                                             # armory/viewer (Kestrel listens on 8080 in-container)
#    volumes:
#      - ./data:/app/data                                        # the same database the game server built (see below)
#      - /path/to/client/RDB:/rdb:ro                             # the client RDB (3D models / renders)
#    depends_on: [cdn]
#    restart: unless-stopped

# ---------------------------------------------------------------------------------------------------------------
# CDN MIRROR (commented) - Faolan.Web.Content, a store-and-forward mirror of AoC's UPM content CDN. Two consumers:
#   - the CLIENT/patcher, pointed here by `Faolan.ClientLauncher --mirror` (it rewrites LocalConfig.xml's three
#     patch-addr keys), so a full ConanPatcher run archives the whole current revision into ./cdn-store;
#   - Faolan.Web, for the on-demand RDB blobs its 3D viewer needs (`CdnUrl` above).
# It is INDEPENDENT of the game server - no database, no RDB dir - so it can run alone.
#
# ⚠️ It fetches from the real Age of Conan CDN on a miss, so it needs outbound internet. On a hit it never leaves
#    disk. The store is content-addressed (the last path segment IS the payload md5), so it is self-verifying and
#    safe to share between runs - and worth persisting: a full patcher run is many GB.
# ⚠️ `CdnMirror__Ip` MUST be 0.0.0.0 here (the image defaults it): the code's own default is 127.0.0.1, which
#    inside a container is loopback the published port cannot reach.
# ⚠️ `CdnMirror__PublicAddress` is REQUIRED - the mirror exits at startup without it. The LocalConfig.xml it serves
#    back rewrites the patch addresses to point at the mirror, and only you know what a client can dial: NOT the bind
#    address (0.0.0.0 here) and not the published port's container side, but the host address the port maps to. The
#    client keeps that value in its own config, so a guess would be a wrong patch address that looks like it worked.
# ---------------------------------------------------------------------------------------------------------------
#  cdn:
#    build:
#      context: .
#      dockerfile: Faolan.Web.Content/Dockerfile
#    image: projectfaolan-cdn
#    environment:
#      CdnMirror__Ip: "0.0.0.0"       # bind all interfaces IN the container (the code default, 127.0.0.1, is unreachable)
#      CdnMirror__Port: 7081
#      CdnMirror__Store: "/app/store"
#      CdnMirror__PublicAddress: "gameserver.example.com:7081"   # REQUIRED: what a CLIENT dials, written into LocalConfig.xml
#    ports:
#      - "7081:7081"                  # what --mirror and CdnUrl point at
#    volumes:
#      - ./cdn-store:/app/store       # the archived CDN blobs; a clean slate is just `rm -rf ./cdn-store`
#    restart: unless-stopped

